name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite (local DB adapter used by the tests) needs Node 22.13+
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Tests
        run: npm test

      - name: Build client
        run: npx vite build

      - name: Bundle Worker (no deploy)
        run: npx wrangler deploy --dry-run --outdir dist/worker

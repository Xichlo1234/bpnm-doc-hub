name: CI

on:
  # Every branch (the repository's working branches are not named main) and every PR
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite (local DB adapter used by the tests) needs Node 22.13+
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runtime dependencies only; xlsx has no upstream fix (see docs/ops/DEPENDENCIES.md), so the
      # gate is "no critical", and the full report is printed for review.
      - name: Dependency audit (production)
        run: |
          npm audit --omit=dev || true
          npm run audit:prod

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Tests
        run: npm test

      - name: Build client
        run: npx vite build

      - name: Bundle Worker (no deploy)
        run: npx wrangler deploy --dry-run --outdir dist/worker

      - name: Worker bundle contains no seed business data
        run: |
          if grep -l "excel_contracts\|SGII_LEG_CON\|Blackstone" dist/worker/*.js; then
            echo "Business data found in the Worker bundle" && exit 1
          fi
